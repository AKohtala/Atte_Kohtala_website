<!DOCTYPE html>
<html lang="fi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Error | Atte Kohtala</title>
  <meta name="description" content="Something went wrong.">
  <link rel="alternate" hreflang="fi" href="https://attekohtala.fi/virhe/" />
  <link rel="alternate" hreflang="en" href="https://attekohtala.fi/en/error/" />
  <link rel="canonical" href="https://attekohtala.fi/virhe/" />

  <link rel="preload" href="/fonts/Lora[wght].woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/css/style.css" as="style">

  <link rel="stylesheet" href="/css/style.css">
  <meta name="theme-color" content="#33711c">
  
  <link rel="icon" type="image/png" href="/assets/images/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Atte Kohtala" />
  <link rel="manifest" href="/assets/images/site.webmanifest" />

  <!-- Script and dark theme function by Miguel Grinberg (https://blog.miguelgrinberg.com/post/how-to-add-dark-mode-support-to-your-website) -->
  <script>
    const prefersDarkMode = window.matchMedia('(prefers-color-scheme: dark)')

    function updateTheme() {
      const theme = prefersDarkMode.matches ? 'dark' : 'light'
      document.documentElement.setAttribute('data-theme', theme)
    }

    updateTheme();
    prefersDarkMode.addEventListener("change", () => updateTheme());
  </script>

  <!-- https://www.w3schools.com/howto/howto_js_topnav_responsive.asp -->
  <script>
    function myFunction() {
      var x = document.getElementById("myTopnav");
      if (x.className === "mid-header") {
        x.className += " responsive";
      } else {
        x.className = "mid-header";
      }
    } 
  </script>

</head>
<body>

  <header class="header">
    <div class="header-container">
      <a href="/en/" data-simple-event="to_home_from_header" class="logo">Atte Kohtala</a>
      <button type="button" class="icon" aria-label="Open navigation" onclick="myFunction()">
        <img class="hamburger" src="/assets/images/keyboard.svg" alt="" aria-hidden="true">
      </button>
      <nav class="mid-header" id="myTopnav">
        <a class="anav" data-simple-event="to_piano_from_header" href="/en/piano/">Piano</a>
        <a class="anav" data-simple-event="to_photography_from_header" href="/en/photography/">Photography</a>
        <a class="anav" data-simple-event="to_contact_from_header" href="/en/contact/">Contact</a>
        <a class="language-switcher" data-simple-event="manual_language_switch" href="/virhe/">FI</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="error404-1">
      <section class="text-home-1">
        <h1 class="kiitos">Oops!</h1>
        <p>Something went wrong.</p>
        <a href="/yhteystiedot/">
          <button data-simple-event="to_contact_from_404_button">Back</button>
        </a>
      </section>
      <section class="block">
        <img loading="lazy" width="1000" height="667" src="/assets/images/Revontulivyo.webp" alt="Aurora borealis">
      </section>
    </div>
  </main>
  
  <footer>
    <div class="footer">
      <a href="/" data-simple-event="to_home_from_footer" class="logo-footer">Atte Kohtala</a>
      <p class="mid-footer">
        <a class="anav" data-simple-event="to_contact_from_footer" href="/en/contact/">Contact</a>
        <a class="anav" data-simple-event="to_privacy_from_footer" href="/en/privacypolicy/">Privacy Policy</a>
      </p>
      <p class="copyright">
        &copy; 2026 Atte Kohtala
      </p>
    </div>
  </footer>

  <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade"/></noscript>
  <script async src="https://scripts.simpleanalyticscdn.com/inline-events.js"></script>
</body>
</html>
