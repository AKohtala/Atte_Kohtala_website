name: Deploy Files

on:
  push:
    branches:
      - oma

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: SFTP upload
        uses: Dylan700/sftp-upload-action@5108b43b1cd4d60abd1982edb4c7159ece875c44 # v1.2.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          uploads: |
            ./ => ./www/
          ignore: |
            *.git
            */**/*git*
            *.github
            */**/*.github*
          delete: 'true'
